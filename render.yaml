services:
  - type: web
    name: jobtrack-staging
    runtime: image
    plan: free
    image:
      url: ghcr.io/gamerjack27/jobtrack-backend:latest
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: NODE_ENV
        value: staging
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

  - type: web
    name: jobtrack-production
    runtime: image
    plan: free
    image:
      url: ghcr.io/gamerjack27/jobtrack-backend:latest
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

  - type: web
    name: jobtrack-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://jobtrack-production.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: jobtrack-db
    plan: free