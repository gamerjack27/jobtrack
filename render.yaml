services:
  - type: web
    name: jobtrack-staging
    runtime: image
    plan: free
    image:
      url: ghcr.io/gamerjack27/jobtrack-backend:c139fcce69a66f61b9e6e7dfa069f5b5944c538a
      creds:
        fromRegistryCreds:
          name: ghcr-read-packages
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: NODE_ENV
        value: staging
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

  - type: web
    name: jobtrack-production
    runtime: image
    plan: free
    image:
      url: ghcr.io/gamerjack27/jobtrack-backend:c139fcce69a66f61b9e6e7dfa069f5b5944c538a
      creds:
        fromRegistryCreds:
          name: ghcr-read-packages
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrack-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true

databases:
  - name: jobtrack-db
    plan: free