name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobtrack
          POSTGRES_PASSWORD: jobtrack_dev
          POSTGRES_DB: jobtrack_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://jobtrack:jobtrack_dev@localhost:5433/jobtrack_test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: backend
      - name: Apply database migrations
        run: npx prisma migrate deploy
        working-directory: backend
      - name: Run backend tests with coverage
        run: npm run test:coverage
        working-directory: backend
      - name: Upload backend coverage report
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage-report
          path: backend/coverage/

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Run frontend tests with coverage
        run: npm run coverage
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Upload frontend coverage report
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

  prepare-deployment-artifact:
    runs-on: ubuntu-latest
    needs: [dependency-audit, backend-tests, frontend-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, tag and push the image to GHCR
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/jobtrack-backend"
          docker build -t "$IMAGE:${GITHUB_SHA}" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:${GITHUB_SHA}"
          docker push "$IMAGE:latest"